# 小满童装中台 —— nginx 反向代理示例
# 放到 /etc/nginx/conf.d/xiaoman.conf，然后 nginx -t && systemctl reload nginx
#
# 适用场景：想用域名 + 80/443 访问，而不暴露 8765 端口。
# 记得把 server.js 用 HOST=127.0.0.1 启动（只让 nginx 转发进来）。

server {
    listen 80;
    server_name your-domain.com;          # 没有域名就写服务器公网 IP

    client_max_body_size 20m;

    # 可选：加一道密码，防止别人乱翻数据（内部试用强烈建议开）
    # htpasswd -c /etc/nginx/xiaoman.htpasswd xiaoman
    # auth_basic "XIAOMAN KIDS";
    # auth_basic_user_file /etc/nginx/xiaoman.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# 想上 HTTPS（推荐）：
#   apt install -y certbot python3-certbot-nginx
#   certbot --nginx -d your-domain.com
# 证书会自动续期；国内服务器用域名必须先备案，没备案就直接用 http://公网IP 访问。